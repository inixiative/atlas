# Example — copy to .github/workflows/atlas-incremental.yml in your repo.
# Enforce annotations only on the files a PR changes (Phase 2 of the rollout):
# new/edited code must be annotated; legacy code is grandfathered.
name: atlas (incremental)

on: pull_request

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A JS/TS repo installs its pinned atlas; any other repo runs it through bunx as-is.
      - run: if [ -f package.json ]; then bun install --frozen-lockfile; fi

      - name: atlas check (changed files)
        # One atlas run over the files the PR adds or changes; a file atlas doesn't consider is
        # ignored. NUL-separated and unquoted so spaces and non-ASCII names survive.
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git -c core.quotePath=false diff --name-only -z --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" \
            | xargs -0 -r bunx @inixiative/atlas check
