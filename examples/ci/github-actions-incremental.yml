# Example — copy to .github/workflows/atlas-incremental.yml in your repo.
# Enforce annotations only on the paths a PR changes (Phase 2 of the rollout):
# new/edited code must be annotated; legacy code is grandfathered.
name: atlas (incremental)

on: pull_request

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A JS/TS repo installs its pinned atlas; any other repo runs it through bunx as-is.
      - run: if [ -f package.json ]; then bun install --frozen-lockfile; fi

      - name: atlas check (changed paths)
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          # every changed directory; atlas itself decides which files in it it considers
          changed=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" \
            | xargs -r -n1 dirname | sort -u)
          [ -z "$changed" ] && { echo "no changes"; exit 0; }
          status=0
          for dir in $changed; do
            bunx @inixiative/atlas check "$dir" || status=1
          done
          exit $status
