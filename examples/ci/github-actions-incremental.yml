# Example — copy to .github/workflows/atlas-incremental.yml in your repo.
# Enforce annotations only on the files a PR changes (Phase 2 of the rollout):
# new/edited code must be annotated; legacy code is grandfathered.
name: atlas (incremental)

on: pull_request

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A JS/TS repo installs its pinned atlas; any other repo runs it through bunx as-is.
      - run: if [ -f package.json ]; then bun install --frozen-lockfile; fi

      - name: atlas check (changed files)
        # The files the PR adds or changes; a file atlas doesn't consider is ignored. NUL-separated
        # and unquoted so spaces and non-ASCII names survive. The list goes through a file and the
        # shell fails on any error, so a failed diff fails the step instead of checking nothing.
        # (A very long list is split by xargs into several atlas runs; any failing run fails it.)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          git -c core.quotePath=false diff --name-only -z --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed"
          xargs -0 -r bunx @inixiative/atlas check < "$RUNNER_TEMP/changed"
